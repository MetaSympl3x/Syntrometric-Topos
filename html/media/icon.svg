<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#05080F" />
    </radialGradient>
    <linearGradient id="goldSheaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
    <linearGradient id="blueTopos" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4169E1" />
      <stop offset="100%" stop-color="#00FFFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="rgba(65, 105, 225, 0.4)" stroke-width="4" />
  
  <!-- Outer Sheaf Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#blueTopos)" stroke-width="8" stroke-dasharray="14 10" opacity="0.75" />
  
  <!-- Dialectical Triangles -->
  <polygon points="256,110 380,330 132,330" fill="none" stroke="url(#goldSheaf)" stroke-width="7" filter="url(#glow)" />
  <polygon points="256,380 132,160 380,160" fill="none" stroke="url(#blueTopos)" stroke-width="7" opacity="0.85" filter="url(#glow)" />
  
  <!-- Core Monad Node -->
  <circle cx="256" cy="256" r="32" fill="#FFD700" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#FFFFFF" />
  
  <!-- Topos Category Symbol -->
  <text x="256" y="270" text-anchor="middle" font-family="'Libertinus Serif', 'Times New Roman', serif" font-size="38" font-style="italic" font-weight="bold" fill="#05080F">ℰ</text>
</svg>

