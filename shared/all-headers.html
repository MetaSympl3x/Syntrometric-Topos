window.togglePresentationScrollView = function() {
  const now = Date.now();
  if (now - toggleScrollDebounce < 350) return;
  toggleScrollDebounce = now;

        }
        slD.dispatchEvent(new Event('input', { bubbles: true }));
      }
      if (typeof window.updateBands === 'function') window.updateBands();
    }
  }

  function handleDragMove(clientX) {
    if (!activeDrag) return;
    if (activeDrag.type === 'slider') {
      updateSliderFromCoords(activeDrag.el, clientX);
    } else if (activeDrag.type === 'track') {
      updateBandTrackFromCoords(activeDrag.el, clientX);
    }
  }

  function handleDragEnd(clientX) {
    if (!activeDrag) return;
    if (clientX !== undefined) handleDragMove(clientX);
    if (activeDrag.type === 'slider') {
      if (typeof activeDrag.el.onchange === 'function') {
        try { activeDrag.el.onchange.call(activeDrag.el, new Event('change')); } catch(err) {}
      }
      activeDrag.el.dispatchEvent(new Event('change', { bubbles: true }));
    }
    activeDrag = null;
  }

  // GLOBAL MOVE AND UP LISTENERS ON WINDOW IN CAPTURE PHASE
  window.addEventListener('pointermove', function(e) {
    if (activeDrag) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
      handleDragMove(e.clientX);
    }
  }, { passive: false, capture: true });

  window.addEventListener('pointerup', function(e) {
    if (activeDrag) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
      handleDragEnd(e.clientX);
    }
  }, { passive: false, capture: true });

  window.addEventListener('pointercancel', function(e) {
    if (activeDrag) {
      handleDragEnd();
    }
  }, { passive: true, capture: true });

  window.addEventListener('touchmove', function(e) {
    if (activeDrag && e.touches && e.touches.length > 0) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
      handleDragMove(e.touches[0].clientX);
    }
  }, { passive: false, capture: true });

  window.addEventListener('touchend', function(e) {
    if (activeDrag) {
      var cx = e.changedTouches && e.changedTouches.length > 0 ? e.changedTouches[0].clientX : undefined;
      handleDragEnd(cx);
    }
  }, { passive: false, capture: true });

  window.addEventListener('touchcancel', function(e) {
    if (activeDrag) {
      handleDragEnd();
    }
  }, { passive: true, capture: true });

  var INTERACTIVE_SELECTORS = [
    'input', 'button', 'select', 'textarea', 'label', 'canvas', 'svg',
    '.interactive-panel', '.slider-row', '.band-track', '#syn-bottom-dock', '.anim-hud-tray',
    '.animation-hud', '#syntrix-3d-hud', '[id$="-3d-hud"]', '[id$="-3d-wrap"]',
    '#syn-monograph-fab', '#syn-monograph-drawer', '.mdrawer-tab', '.mdrawer-header',
    '.mdrawer-body', '.mdrawer-pane', '.rosetta-card', '.rosetta-list',
    '#monograph-tex-viewer', '.syn-btn', '.subsys-toggle', '.tab-btn',
    '.syn-tab-btn', '.m3d-btn', '.pdf-cite-badge', '.ch1-hud-btn',
    '.chapter-jump-select', '.tex-search-input'
  ].join(', ');

  function isolateInteractiveElement(el) {
    if (!el || el.nodeType !== 1) return;

    if (!el.hasAttribute('data-prevent-swipe')) {
      el.setAttribute('data-prevent-swipe', 'true');
    }

    var panel = el.closest('#syn-bottom-dock, .interactive-panel, .anim-hud-tray, #syntrix-3d-hud, [id$="-3d-hud"], [id$="-3d-wrap"], #syn-monograph-drawer, .slider-row, .band-track');
    if (panel && !panel.hasAttribute('data-prevent-swipe')) {
      panel.setAttribute('data-prevent-swipe', 'true');
    }

    if (el.dataset.synMobileTouchInitV3) return;
    el.dataset.synMobileTouchInitV3 = '1';

    // 1. Range Sliders
    if (el.tagName === 'INPUT' && el.type === 'range') {
      el.style.touchAction = 'none';

      el.addEventListener('pointerdown', function(e) {
        if (e.button && e.button !== 0) return;
        activeDrag = { el: el, type: 'slider' };
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        handleDragMove(e.clientX);
      }, { passive: false });

      el.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length === 0) return;
        activeDrag = { el: el, type: 'slider' };
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        handleDragMove(e.touches[0].clientX);
      }, { passive: false });

      return;
    }

    // 2. Band Tracks: Make #p-track, #d-track, .band-track directly interactive
    if (el.classList.contains('band-track') || el.id === 'p-track' || el.id === 'd-track') {
      el.style.touchAction = 'none';
      el.style.cursor = 'pointer';

      el.addEventListener('pointerdown', function(e) {
        if (e.button && e.button !== 0) return;
        activeDrag = { el: el, type: 'track' };
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        handleDragMove(e.clientX);
      }, { passive: false });

      el.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length === 0) return;
        activeDrag = { el: el, type: 'track' };
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        handleDragMove(e.touches[0].clientX);
      }, { passive: false });

      return;
    }

    // 3. Buttons, Tabs, Toggles
    if (el.tagName === 'BUTTON' || el.tagName === 'SELECT' || el.classList.contains('syn-btn') || el.classList.contains('tab-btn') || el.classList.contains('subsys-toggle') || el.classList.contains('syn-tab-btn')) {
      el.style.touchAction = 'manipulation';
      el.addEventListener('pointerdown', function(e) { e.stopPropagation(); }, { passive: true });
      el.addEventListener('touchstart', function(e) { e.stopPropagation(); }, { passive: true });
      return;
    }

    // 4. 3D Canvas & Wrappers
    if (el.tagName === 'CANVAS' || (el.id && el.id.indexOf('-3d-wrap') !== -1) || el.classList.contains('syntrix-3d-canvas')) {
      el.style.touchAction = 'none';
      el.addEventListener('pointerdown', function(e) { e.stopPropagation(); }, { passive: true });
      el.addEventListener('touchstart', function(e) { e.stopPropagation(); }, { passive: true });
      return;
    }

    el.addEventListener('pointerdown', function(e) {
      if (el.tagName !== 'SECTION') e.stopPropagation();
    }, { passive: true });
  }

  function scanAndIsolate() {
    try {
      var els = document.querySelectorAll(INTERACTIVE_SELECTORS);
      for (var i = 0; i < els.length; i++) {
        isolateInteractiveElement(els[i]);
      }
    } catch (e) {}
  }

  // Capture phase guard: immediately isolate any touched element
  function capturePhaseGuard(e) {
    var t = e.target;
    if (!t || t.nodeType !== 1) return;
    var interactive = t.closest(INTERACTIVE_SELECTORS);
    if (interactive) {
      if (!interactive.hasAttribute('data-prevent-swipe')) {
        interactive.setAttribute('data-prevent-swipe', 'true');
      }
      var panel = interactive.closest('.interactive-panel, .anim-hud-tray, #syntrix-3d-hud, [id$="-3d-hud"], [id$="-3d-wrap"], #syn-monograph-drawer');
      if (panel && !panel.hasAttribute('data-prevent-swipe')) {
        panel.setAttribute('data-prevent-swipe', 'true');
      }
      isolateInteractiveElement(interactive);
    }
  }

  window.addEventListener('touchstart', capturePhaseGuard, { capture: true, passive: true });
  window.addEventListener('pointerdown', capturePhaseGuard, { capture: true, passive: true });

  try {
    var observer = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        if (mutations[i].addedNodes && mutations[i].addedNodes.length) {
          scanAndIsolate();
          break;
        }
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  } catch (e) {}

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scanAndIsolate);
  } else {
    scanAndIsolate();
  }

  if (window.Reveal && window.Reveal.on) {
    window.Reveal.on('ready', scanAndIsolate);
    window.Reveal.on('slidechanged', scanAndIsolate);
    window.Reveal.on('fragmentshown', scanAndIsolate);
  }
})();
</script>
