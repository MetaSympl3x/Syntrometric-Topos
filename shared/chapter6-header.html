<script>
// Expose robust scroll view toggle helper for Quarto Reveal.js with debounce guard
let toggleScrollDebounce = 0;
window.togglePresentationScrollView = function() {
  const now = Date.now();
  if (now - toggleScrollDebounce < 350) return;
  toggleScrollDebounce = now;

  if (!window.Reveal) return;
  const qs = window.Reveal.getPlugin ? window.Reveal.getPlugin("quarto-support") : null;
  if (qs && typeof qs.toggleScrollView === 'function') {
    qs.toggleScrollView();
  } else if (typeof window.Reveal.toggleScrollView === 'function') {
    const isScroll = typeof window.Reveal.isScrollView === 'function' && window.Reveal.isScrollView();
    if (isScroll) {
      window.Reveal.configure({ scrollActivationWidth: 0 });
      window.Reveal.toggleScrollView(false);
    } else {
      window.Reveal.configure({ scrollActivationWidth: null });
      window.Reveal.toggleScrollView(true);
    }
  } else {
    const ev = new KeyboardEvent('keydown', { key: 'r', keyCode: 82, which: 82, bubbles: true });
    document.dispatchEvent(ev);
  }

  setTimeout(() => {
    if (window.Reveal && typeof window.Reveal.layout === 'function') {
      window.Reveal.layout();
    }
    if (window.MathJax && window.MathJax.Hub) {
      window.MathJax.Hub.Queue(["Typeset", window.MathJax.Hub]);
    }
  }, 100);

  setTimeout(() => {
    const isScroll = window.Reveal && typeof window.Reveal.isScrollView === 'function' ? window.Reveal.isScrollView() : false;
    try { window.parent.postMessage({ type: 'scroll-view-state', isScrollView: isScroll }, '*'); } catch (e) {}
  }, 150);
};

// Listen for message from parent index.html
window.addEventListener('message', (event) => {
  if (!event.data) return;
  if (event.data.type === 'toggle-scroll-view') {
    window.togglePresentationScrollView();
  } else if (event.data.type === 'window-resize' || event.data.type === 'resize') {
    if (window.handleDynamicScaling) window.handleDynamicScaling();
  }
});

// Dynamic Window Scaling & Resize Controller
(function() {
  let resizeTimer = null;

  function performDynamicScaling() {
    if (window.Reveal) {
      if (typeof window.Reveal.layout === 'function') {
        window.Reveal.layout();
      }
    }
    if (window.MathJax && window.MathJax.Hub) {
      try {
        window.MathJax.Hub.Queue(["Rerender", window.MathJax.Hub]);
      } catch (e) {}
    }
    if (typeof prepareVideosAndPanels === 'function') {
      prepareVideosAndPanels();
    }
    try {
      const scale = window.Reveal && typeof window.Reveal.getScale === 'function' ? window.Reveal.getScale() : 1;
      window.dispatchEvent(new CustomEvent('syntrometrie:resize', {
        detail: {
          width: window.innerWidth,
          height: window.innerHeight,
          scale: scale,
          isScroll: window.Reveal && typeof window.Reveal.isScrollView === 'function' ? window.Reveal.isScrollView() : false
        }
      }));
    } catch (e) {}
  }

  window.handleDynamicScaling = function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(performDynamicScaling, 50);
  };

  window.addEventListener('resize', window.handleDynamicScaling, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(performDynamicScaling, 100));
  document.addEventListener('fullscreenchange', () => setTimeout(performDynamicScaling, 60));
})();

// Mobile & Scroll View Animation Controller (Videos, Interactive Panels & Cards)
(function() {
  let scrollObserver = null;

  function prepareVideosAndPanels() {
    // 1. Prepare and configure videos
    const videos = document.querySelectorAll('video');
    videos.forEach(v => {
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      v.setAttribute('muted', '');
      v.muted = true;
      v.defaultMuted = true;
      v.setAttribute('loop', '');
      v.setAttribute('preload', 'auto');
      v.style.cursor = 'pointer';

      // Tap on touch devices to toggle play/pause
      if (!v.dataset.touchBound) {
        v.dataset.touchBound = 'true';
        v.addEventListener('click', (e) => {
          e.stopPropagation();
          if (v.paused) {
            v.play().catch(() => {});
          } else {
            v.pause();
          }
        });
      }

      // If video is in active slide or in scroll mode, start playback
      const slide = v.closest('.present, .scroll-page, section');
      if (slide && (slide.classList.contains('present') || document.querySelector('.reveal-viewport.reveal-scroll'))) {
        v.play().catch(() => {});
      }
    });

    // 2. Tag panels and cards with .syn-scroll-reveal for polished scroll reveals
    const revealTargets = document.querySelectorAll(
      '.interactive-panel, .video-card, .video-container, .thm-box, .def-box, .prop-box, .proof-box, .carnap-box, .firewall-box, .intuition-box, .vignette-box, .scholium-box, .claim-ceiling, .lean-card, .lean-code-card'
    );
    revealTargets.forEach(el => {
      if (!el.classList.contains('syn-scroll-reveal')) {
        el.classList.add('syn-scroll-reveal');
      }
    });

    // 3. Setup IntersectionObserver for smooth entrance and in-view autoplay
    if ('IntersectionObserver' in window) {
      if (!scrollObserver) {
        scrollObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            const el = entry.target;
            if (entry.isIntersecting && entry.intersectionRatio >= 0.08) {
              el.classList.add('syn-in-view');

              // Autoplay visible video or nested videos
              if (el.tagName === 'VIDEO') {
                el.play().catch(() => {});
              } else {
                const innerVids = el.querySelectorAll('video');
                innerVids.forEach(iv => iv.play().catch(() => {}));
              }
            } else if (!entry.isIntersecting && entry.intersectionRatio === 0) {
              // Pause when completely off screen to preserve battery
              if (el.tagName === 'VIDEO') {
                el.pause();
              } else {
                const innerVids = el.querySelectorAll('video');
                innerVids.forEach(iv => iv.pause());
              }
            }
          });
        }, {
          threshold: [0, 0.08, 0.4],
          rootMargin: '30px 0px 30px 0px'
        });
      }

      // Observe all videos and reveal targets
      videos.forEach(v => scrollObserver.observe(v));
      revealTargets.forEach(rt => scrollObserver.observe(rt));
    }
  }
  window.prepareVideos = prepareVideosAndPanels;
  window.prepareVideosAndPanels = prepareVideosAndPanels;

  // Awaken media on first touch or scroll
  let mediaUnlocked = false;
  function unlockMedia() {
    if (mediaUnlocked) return;
    mediaUnlocked = true;
    document.querySelectorAll('video').forEach(v => {
      v.muted = true;
      v.defaultMuted = true;
      const rect = v.getBoundingClientRect();
      if (rect.top < window.innerHeight && rect.bottom > 0) {
        v.play().catch(() => {});
      }
    });
  }
  document.addEventListener('touchstart', unlockMedia, { passive: true });
  document.addEventListener('click', unlockMedia, { passive: true });
  window.addEventListener('scroll', unlockMedia, { passive: true });

  function initRevealHooks() {
    if (window.Reveal) {
      if (typeof window.Reveal.configure === 'function') {
        try {
          window.Reveal.configure({
            mouseWheel: true
          });
        } catch (e) {}
      }

      window.Reveal.on('slidechanged', (e) => { if (e && e.currentSlide) e.currentSlide.scrollTop = 0; setTimeout(prepareVideosAndPanels, 60); });
      window.Reveal.on('ready', () => {
        setTimeout(prepareVideosAndPanels, 120);
        try {
          const isScroll = window.Reveal.isScrollView && window.Reveal.isScrollView();
          window.parent.postMessage({ type: 'scroll-view-state', isScrollView: isScroll }, '*');
        } catch (e) {}
      });
      window.Reveal.on('scroll-view-activated', () => {
        setTimeout(() => {
          if (window.MathJax && window.MathJax.Hub) {
            window.MathJax.Hub.Queue(["Typeset", window.MathJax.Hub]);
          }
          prepareVideosAndPanels();
        }, 120);
        try { window.parent.postMessage({ type: 'scroll-view-state', isScrollView: true }, '*'); } catch (e) {}
      });
      window.Reveal.on('scroll-view-deactivated', () => {
        setTimeout(() => {
          if (window.MathJax && window.MathJax.Hub) {
            window.MathJax.Hub.Queue(["Typeset", window.MathJax.Hub]);
          }
          prepareVideosAndPanels();
        }, 120);
        try { window.parent.postMessage({ type: 'scroll-view-state', isScrollView: false }, '*'); } catch (e) {}
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      prepareVideosAndPanels();
      initRevealHooks();
    });
  } else {
    prepareVideosAndPanels();
    initRevealHooks();
  }
  window.addEventListener('load', () => {
    prepareVideosAndPanels();
    initRevealHooks();
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      for (var i = 0; i < regs.length; i++) regs[i].unregister();
    }).catch(function() {});
  }
})();
